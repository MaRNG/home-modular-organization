<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOD · Modulární organizace domácnosti</title>
  <link rel="preload" href="vendor/fonts/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="2" y="2" width="9" height="9"/><rect x="13" y="2" width="9" height="9"/><rect x="2" y="13" width="20" height="9"/></symbol>
    <symbol id="i-straight" viewBox="0 0 24 24"><path d="M2.5 7.5h19v9h-19z"/><path d="M2.5 10.5h19M2.5 13.5h19" stroke-dasharray="1.5 2"/></symbol>
    <symbol id="i-end" viewBox="0 0 24 24"><path d="M21.5 7.5H7a4.5 4.5 0 0 0 0 9h14.5"/><path d="M21.5 10.5H7M21.5 13.5H7" stroke-dasharray="1.5 2"/></symbol>
    <symbol id="i-corner-left" viewBox="0 0 24 24"><path d="M2.5 16.5h14v-14h-6v8h-8z"/></symbol>
    <symbol id="i-corner-right" viewBox="0 0 24 24"><path d="M2.5 7.5h14v14h-6v-8h-8z"/></symbol>
    <symbol id="i-cross" viewBox="0 0 24 24"><path d="M9 2.5h6V9h6.5v6H15v6.5H9V15H2.5V9H9z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M2.5 20.5h17v-18"/><path d="M2.5 15.5h12v-13"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M2.5 3.5h17v18"/><path d="M2.5 8.5h12v13"/></symbol>
    <symbol id="i-s-left" viewBox="0 0 24 24"><path d="M2.5 15.5H7c4.5 0 4.5-10 9-10h5.5"/><path d="M2.5 19.5H7c4.5 0 4.5-10 9-10h5.5"/></symbol>
    <symbol id="i-s-right" viewBox="0 0 24 24"><path d="M2.5 4.5H7c4.5 0 4.5 10 9 10h5.5"/><path d="M2.5 8.5H7c4.5 0 4.5 10 9 10h5.5"/></symbol>
    <symbol id="i-lid" viewBox="0 0 24 24"><path d="M2.5 9.5h19v3h-19z"/><path d="M5 12.5v3M19 12.5v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5M4 17.5v3h16v-3"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3.5 9V3.5H9M15 3.5h5.5V9M20.5 15v5.5H15M9 20.5H3.5V15"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M3.5 3.5h17v17h-17zM3.5 7.5h17"/><path d="M10 7.5v4h4v-4M12 11.5v2"/><path d="M6.5 17.5h11"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M2.5 5.5h7l2 2.5h10v11.5h-19z"/><path d="M2.5 10.5h19"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M10 5.5 3.5 12l6.5 6.5M4 12h16.5"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="./" aria-label="MOD – modulární organizace domácnosti">
      <svg class="brand-mark"><use href="#i-logo"/></svg>
      <span class="brand-name">MOD</span>
      <span class="brand-sub">Modulární organizace domácnosti</span>
    </a>
    <span class="topbar-category">Kabely</span>
    <span id="assembly-name" class="topbar-name"></span>
    <div class="topbar-end">
      <p id="status" class="status" role="status">Načítám OpenSCAD…</p>
      <button id="help" class="btn btn-on-dark btn-help" type="button" title="Průvodce editorem" aria-label="Průvodce editorem">?</button>
      <button id="library" class="btn btn-on-dark" type="button"><svg class="ico"><use href="#i-folder"/></svg>Sestavy</button>
      <button id="reset" class="btn btn-on-dark" type="button">Nová sestava</button>
    </div>
  </header>

  <div class="workspace">
    <main id="viewport" class="scene" aria-label="3D náhled sestavy">
      <div id="tags" class="tags" aria-hidden="true"></div>
      <button id="fit" class="scene-fit" type="button" title="Zobrazit celou sestavu" aria-label="Zobrazit celou sestavu">
        <svg class="ico"><use href="#i-fit"/></svg>
      </button>
      <p class="scene-legend">
        <span><b>Klik</b> vybrat díl</span>
        <span><b>Šipka</b> připojit další</span>
        <span><b>Tažení</b> otočit</span>
        <span><b>Kolečko</b> přiblížit</span>
      </p>
      <div id="port-menu" class="port-menu" role="menu" aria-label="Připojit díl" hidden>
        <p class="port-menu-title"><span>Připojit díl</span>
          <button type="button" class="port-menu-close" data-close aria-label="Zavřít nabídku" title="Zavřít (Esc)">×</button></p>
        <button role="menuitem" data-add="straight" data-port="0"><svg class="ico"><use href="#i-straight"/></svg>Rovný díl</button>
        <button role="menuitem" data-add="corner" data-port="0"><svg class="ico"><use href="#i-corner-left"/></svg>Zatáčka doleva</button>
        <button role="menuitem" data-add="corner" data-port="1"><svg class="ico"><use href="#i-corner-right"/></svg>Zatáčka doprava</button>
        <button role="menuitem" data-add="cross" data-port="0"><svg class="ico"><use href="#i-cross"/></svg>Křižovatka</button>
        <button role="menuitem" data-add="up" data-port="0"><svg class="ico"><use href="#i-up"/></svg>Nahoru <small>vnitřní roh</small></button>
        <button role="menuitem" data-add="down" data-port="0"><svg class="ico"><use href="#i-down"/></svg>Dolů <small>přes hranu</small></button>
        <button role="menuitem" data-add="s" data-port="0"><svg class="ico"><use href="#i-s-left"/></svg>Díl S doleva <small>přesazení</small></button>
        <button role="menuitem" data-add="s" data-port="0" data-right><svg class="ico"><use href="#i-s-right"/></svg>Díl S doprava <small>přesazení</small></button>
        <button role="menuitem" data-add="end" data-port="0"><svg class="ico"><use href="#i-end"/></svg>Koncovka <small>uzavře trasu</small></button>
      </div>
    </main>

    <aside class="pass" aria-label="Nastavení">
      <div class="pass-tabs" role="tablist">
        <button role="tab" id="tab-part" data-tab="part" aria-controls="part-panel">Díl<span class="tab-scope"></span></button>
        <button role="tab" id="tab-run" data-tab="run" aria-controls="run-panel">Trasa<span class="tab-scope"></span></button>
        <button role="tab" id="tab-assembly" data-tab="assembly" aria-controls="assembly-panel">Sestava<span class="tab-scope"></span></button>
      </div>
      <section id="part-panel" class="pass-panel" role="tabpanel" aria-labelledby="tab-part"></section>
      <section id="run-panel" class="pass-panel" role="tabpanel" aria-labelledby="tab-run" hidden></section>
      <section id="assembly-panel" class="pass-panel" role="tabpanel" aria-labelledby="tab-assembly" hidden>
        <div class="scope"><span>Platí pro</span><b id="assembly-scope"></b></div>
        <div id="global-panel" class="segment"></div>
      </section>
    </aside>

    <section class="board" aria-labelledby="board-title">
      <header class="board-head">
        <h2 id="board-title">K tisku</h2>
        <p id="print-summary" class="board-summary"></p>
        <p id="fit-summary" class="fit-summary" hidden></p>
        <div class="board-actions">
          <button id="printer" class="btn btn-on-dark btn-printer" type="button" title="Tiskárna a tisková podložka">
            <svg class="ico"><use href="#i-printer"/></svg><span id="printer-name"></span></button>
          <button id="export-stl" class="btn btn-on-dark" type="button">STL sestavy</button>
          <button id="export-zip" class="btn btn-primary" type="button"><svg class="ico"><use href="#i-download"/></svg>Stáhnout vše · ZIP</button>
        </div>
      </header>
      <div class="board-scroll">
        <table class="board-table">
          <thead>
            <tr><th>Kód</th><th>Díl</th><th>Rozměr</th><th>Úprava</th><th>Podložka</th><th class="num">Ks</th><th>Stav</th><th><span class="visually-hidden">Stáhnout</span></th></tr>
          </thead>
          <tbody id="print-list"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="start" class="modal" role="dialog" aria-modal="true" aria-labelledby="start-title" hidden>
    <div class="modal-body"></div>
  </div>

  <div id="dialog" class="modal modal-top" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden>
    <div class="modal-body"></div>
  </div>
</body>
</html>
